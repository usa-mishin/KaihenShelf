name: Release and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaihenshelf-release-and-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:listing
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifest = Get-Content Packages/com.usamishin.kaihenshelf.core/package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne ('v' + $manifest.version)) { throw 'Tag does not match package version' }
      - name: Build and test package
        run: ./scripts/Build-Package.ps1
      - run: node scripts/build-listing.mjs --local
      - run: npm run build
      - name: Stage release manifest
        run: Copy-Item Packages/com.usamishin.kaihenshelf.core/package.json artifacts/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.zip
            artifacts/*.unitypackage
            artifacts/SHA256SUMS.txt
            artifacts/package.json
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to replace published assets.'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "KaihenShelf $GITHUB_REF_NAME" --notes "VCC / ALCOM: https://usa-mishin.github.io/KaihenShelf/guide/ | Changelog: https://usa-mishin.github.io/KaihenShelf/changelog"
  pages:
    if: ${{ always() && needs.verify.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build complete public repository listing
        id: listing
        shell: bash
        run: |
          if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" = "0" ]; then
            echo 'No release yet; Pages will be published by the first release tag.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/build-listing.mjs
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
        if: steps.listing.outputs.ready == 'true'
      - uses: actions/configure-pages@v5
        if: steps.listing.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.listing.outputs.ready == 'true'
        with:
          path: site/.vitepress/dist
      - uses: actions/deploy-pages@v4
        if: steps.listing.outputs.ready == 'true'
        id: deploy
